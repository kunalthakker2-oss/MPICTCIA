<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | MPICTCIA</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f6f9;
        }


        .header {

            background: #07366d;

            color: white;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .header h2 {
            margin: 0;
        }


        .logout-btn {

            background: #dc3545;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

        }


        .container {

            max-width: 900px;

            margin: 35px auto;

            padding: 0 15px;

        }


        .card {

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 3px 15px rgba(0,0,0,0.1);

            margin-bottom: 30px;

        }


        .card h2 {

            color: #07366d;

            margin-bottom: 20px;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

        }


        input,
        textarea,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

        }


        textarea {

            min-height: 130px;

            resize: vertical;

        }


        .publish-btn {

            background: #0b5da8;

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

        }


        .publish-btn:hover {

            background: #198754;

        }


        .message {

            margin-top: 18px;

            font-weight: bold;

        }


        .info-box {

            background: #eef6ff;

            border-left: 4px solid #0b5da8;

            padding: 12px;

            margin-bottom: 20px;

            line-height: 1.6;

            color: #333;

        }


    </style>

</head>


<body>


<!-- ================= HEADER ================= -->


<div class="header">

    <h2>MPICTCIA Admin Dashboard</h2>


    <button id="logoutBtn" class="logout-btn">

        Logout

    </button>

</div>



<div class="container">


    <!-- ================================================= -->
    <!-- NEWS SECTION -->
    <!-- ================================================= -->


    <div class="card">


        <h2>📰 Add News / Update</h2>


        <form id="newsForm">


            <div class="form-group">

                <label>News Title</label>


                <input
                    type="text"
                    id="newsTitle"
                    placeholder="Enter news title"
                    required>

            </div>



            <div class="form-group">

                <label>Description</label>


                <textarea
                    id="newsDescription"
                    placeholder="Enter complete news/update"
                    required></textarea>

            </div>



            <button
                type="submit"
                class="publish-btn">

                Publish News

            </button>


        </form>


        <div
            id="newsMessage"
            class="message">
        </div>


    </div>



    <!-- ================================================= -->
    <!-- GOVERNMENT ORDER SECTION -->
    <!-- ================================================= -->


    <div class="card">


        <h2>📄 Add Government Order</h2>


        <div class="info-box">

            PDF file ko pehle website ke
            <strong>documents</strong>
            folder me rakhein.

            <br>

            Example:

            <strong>order-31-july-2026.pdf</strong>

        </div>


        <form id="orderForm">


            <!-- ORDER TITLE -->


            <div class="form-group">

                <label>Order Title</label>


                <input
                    type="text"
                    id="orderTitle"
                    placeholder="Example: ICT Instructor Government Order"
                    required>

            </div>



            <!-- ORDER DESCRIPTION -->


            <div class="form-group">

                <label>Order Description</label>


                <textarea
                    id="orderDescription"
                    placeholder="Enter short description of government order"
                    required></textarea>

            </div>



            <!-- ORDER DATE -->


            <div class="form-group">

                <label>Order Date</label>


                <input
                    type="date"
                    id="orderDate"
                    required>

            </div>



            <!-- PDF FILE NAME -->


            <div class="form-group">

                <label>PDF File Name</label>


                <input
                    type="text"
                    id="orderPdf"
                    placeholder="Example: order-31-july-2026.pdf"
                    required>

            </div>



            <button
                type="submit"
                class="publish-btn">

                Publish Government Order

            </button>


        </form>


        <div
            id="orderMessage"
            class="message">
        </div>


    </div>


    <!-- ================================================= -->
    <!-- COURT CASE SECTION -->
    <!-- ================================================= -->

    <div class="card">
        <h2>⚖️ Add Court Case / Update</h2>

        <div class="info-box">
            Court order PDF ho to pehle <strong>documents</strong> folder me rakhein.
            <br>Example: <strong>court-order-01.pdf</strong>
        </div>

        <form id="courtForm">
            <div class="form-group">
                <label>Case Title</label>
                <input type="text" id="caseTitle" placeholder="Example: ICT Instructor Court Case" required>
            </div>

            <div class="form-group">
                <label>Court Name</label>
                <input type="text" id="courtName" placeholder="Example: Madhya Pradesh High Court" required>
            </div>

            <div class="form-group">
                <label>Case Number</label>
                <input type="text" id="caseNumber" placeholder="Example: WP/12345/2026" required>
            </div>

            <div class="form-group">
                <label>Case Status</label>
                <select id="caseStatus" required>
                    <option value="">Select Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Disposed">Disposed</option>
                </select>
            </div>

            <div class="form-group">
                <label>Last Update Date</label>
                <input type="date" id="caseDate" required>
            </div>

            <div class="form-group">
                <label>Case Update / Description</label>
                <textarea id="caseUpdate" placeholder="Enter latest hearing/update" required></textarea>
            </div>

            <div class="form-group">
                <label>Court Order PDF File Name (optional)</label>
                <input type="text" id="casePdf" placeholder="Example: court-order-01.pdf">
            </div>

            <button type="submit" class="publish-btn">Publish Court Case</button>
        </form>

        <div id="courtMessage" class="message"></div>
    </div>


</div>



<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->


<script type="module">


import { initializeApp }

from

"https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";



import {

    getAuth,

    onAuthStateChanged,

    signOut

}

from

"https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";



import {

    getFirestore,

    collection,

    addDoc,

    serverTimestamp

}

from

"https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";



/* ================================================= */
/* FIREBASE CONFIG */
/* ================================================= */


const firebaseConfig = {

    apiKey: "AIzaSyBXDHTCqM3DWHe0P-D1JJxcTLwW9y1vbqM",

    authDomain: "mpictcia.firebaseapp.com",

    projectId: "mpictcia",

    storageBucket: "mpictcia.firebasestorage.app",

    messagingSenderId: "222042559667",

    appId: "1:222042559667:web:43d036827e77e88633ccc6"

};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);



/* ================================================= */
/* LOGIN SECURITY */
/* ================================================= */


onAuthStateChanged(auth, (user) => {


    if (!user) {

        window.location.href = "admin.html";

    }


});



/* ================================================= */
/* LOGOUT */
/* ================================================= */


document
.getElementById("logoutBtn")
.addEventListener(
"click",
async () => {


    await signOut(auth);


    window.location.href =
    "admin.html";


});



/* ================================================= */
/* NEWS SYSTEM */
/* ================================================= */


const newsForm =

document.getElementById("newsForm");


const newsMessage =

document.getElementById("newsMessage");



newsForm.addEventListener(

"submit",

async function(event) {


    event.preventDefault();



    const title =

    document
    .getElementById("newsTitle")
    .value
    .trim();



    const description =

    document
    .getElementById("newsDescription")
    .value
    .trim();



    newsMessage.style.color =
    "#0b5da8";


    newsMessage.innerHTML =
    "Publishing...";



    try {


        await addDoc(

            collection(db, "news"),

            {

                title: title,

                description: description,

                createdAt:
                serverTimestamp()

            }

        );



        newsMessage.style.color =
        "green";


        newsMessage.innerHTML =
        "✅ News Published Successfully!";



        newsForm.reset();


    }


    catch (error) {


        console.error(error);


        newsMessage.style.color =
        "red";


        newsMessage.innerHTML =
        "❌ Error: " +
        error.message;


    }


});



/* ================================================= */
/* GOVERNMENT ORDER SYSTEM */
/* ================================================= */


const orderForm =

document.getElementById("orderForm");


const orderMessage =

document.getElementById("orderMessage");



orderForm.addEventListener(

"submit",

async function(event) {


    event.preventDefault();



    const title =

    document
    .getElementById("orderTitle")
    .value
    .trim();



    const description =

    document
    .getElementById("orderDescription")
    .value
    .trim();



    const orderDate =

    document
    .getElementById("orderDate")
    .value;



    let pdfFile =

    document
    .getElementById("orderPdf")
    .value
    .trim();



    /* Remove documents/ if accidentally entered */


    pdfFile = pdfFile.replace(
        /^documents[\\/]/i,
        ""
    );



    orderMessage.style.color =
    "#0b5da8";


    orderMessage.innerHTML =
    "Publishing Government Order...";



    try {


        await addDoc(

            collection(db, "orders"),

            {

                title: title,

                description: description,

                orderDate: orderDate,

                pdfUrl:
                "documents/" + pdfFile,

                createdAt:
                serverTimestamp()

            }

        );



        orderMessage.style.color =
        "green";


        orderMessage.innerHTML =
        "✅ Government Order Published Successfully!";



        orderForm.reset();


    }


    catch (error) {


        console.error(error);


        orderMessage.style.color =
        "red";


        orderMessage.innerHTML =
        "❌ Error: " +
        error.message;


    }


});


/* ================================================= */
/* COURT CASE SYSTEM */
/* ================================================= */

const courtForm = document.getElementById("courtForm");
const courtMessage = document.getElementById("courtMessage");

courtForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const title = document.getElementById("caseTitle").value.trim();
    const courtName = document.getElementById("courtName").value.trim();
    const caseNumber = document.getElementById("caseNumber").value.trim();
    const status = document.getElementById("caseStatus").value;
    const lastUpdate = document.getElementById("caseDate").value;
    const update = document.getElementById("caseUpdate").value.trim();
    let pdfFile = document.getElementById("casePdf").value.trim();

    if (pdfFile) {
        pdfFile = pdfFile.replace(/^documents[\\/]/i, "");
    }

    courtMessage.style.color = "#0b5da8";
    courtMessage.innerHTML = "Publishing Court Case...";

    try {
        await addDoc(collection(db, "courtCases"), {
            title: title,
            courtName: courtName,
            caseNumber: caseNumber,
            status: status,
            lastUpdate: lastUpdate,
            update: update,
            pdfUrl: pdfFile ? "documents/" + pdfFile : "",
            createdAt: serverTimestamp()
        });

        courtMessage.style.color = "green";
        courtMessage.innerHTML = "✅ Court Case Published Successfully!";
        courtForm.reset();
    } catch (error) {
        console.error(error);
        courtMessage.style.color = "red";
        courtMessage.innerHTML = "❌ Error: " + error.message;
    }
});


</script>


</body>

</html>
